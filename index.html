<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apps Flyer Analytics</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🦉</text></svg>">
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar" aria-label="Navegación principal">
            <button class="sidebar-button active" type="button" data-view="upload-view" aria-label="Cargar archivo" aria-current="page">
                <span class="sidebar-icon">⇪</span>
                <span class="sidebar-label">Cargar</span>
            </button>
            <button class="sidebar-button" type="button" data-view="select-view" aria-label="Seleccionar archivo">
                <span class="sidebar-icon">▣</span>
                <span class="sidebar-label">Archivos</span>
            </button>
            <button class="sidebar-button" type="button" data-view="table-view" aria-label="Ver tabla" disabled>
                <span class="sidebar-icon">◫</span>
                <span class="sidebar-label">Tabla</span>
            </button>
        </aside>

        <main class="main-panel">
            <div class="app-status" role="status" aria-live="polite" aria-atomic="true" hidden></div>
            <section class="view-panel active" id="upload-view" aria-labelledby="upload-title">
                <div class="view-heading">
                    <p class="eyebrow">Paso 1</p>
                    <h1 id="upload-title">Cargar archivo CSV</h1>
                    <p>Agrega un archivo CSV para comenzar a trabajar con sus datos.</p>
                </div>
                <div class="upload-card">
                    <label class="file-picker" for="file-upload">
                        <span class="picker-label">Seleccionar archivo CSV</span>
                    </label>
                    <span class="selection-status">Sin archivos seleccionados</span>
                </div>
            </section>

            <section class="view-panel" id="select-view" aria-labelledby="select-title" hidden>
                <div class="view-heading">
                    <p class="eyebrow">Paso 2</p>
                    <h1 id="select-title">Seleccionar archivo</h1>
                    <p>Elige uno de los archivos CSV disponibles para abrirlo en la tabla.</p>
                </div>
                <div class="available-dbs"></div>
            </section>

            <section class="view-panel table-view" id="table-view" aria-labelledby="table-title" hidden>
                <div class="view-heading table-heading">
                    <div>
                        <p class="eyebrow">Paso 3</p>
                        <h1 id="table-title">Tabla de datos</h1>
                    </div>
                    <span class="selection-status">Sin archivos seleccionados</span>
                </div>
                <div class="container">
                    <table id="main-table"></table>
                </div>
            </section>
        </main>
    </div>

    <input 
        type="file" 
        name="fil-upload" 
        id="file-upload"
        accept=".csv,text/csv"
        hidden>

    <script type="module" src="main.js?v=2"></script>
</body>
</html>
